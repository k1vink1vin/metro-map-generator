name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify canonical TPE_Metro.xlsm
        run: |
          test -s TPE_Metro.xlsm
          unzip -l TPE_Metro.xlsm | grep -q 'xl/vbaProject.bin'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Passenger-map QA
        run: npm run qa:layouts

      - name: Moscow pairwise geographic order QA
        run: npm run qa:geography

      - name: Station and ring geometry regression QA
        run: npm run qa:geometry

      - name: Rendered route topology QA
        run: npm run qa:render

      - name: Schematic design-principle audit
        run: npm run qa:principles

      - name: Build
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
