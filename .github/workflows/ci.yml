name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify canonical TPE_Metro.xlsm
        run: |
          test -s TPE_Metro.xlsm
          unzip -l TPE_Metro.xlsm | grep -q 'xl/vbaProject.bin'
          echo "TPE_Metro.xlsm exists and contains embedded VBA."

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Schematic design-principle audit
        run: npm run qa:principles

      - name: Moscow pairwise geographic order QA
        run: npm run qa:geography

      - name: Station and ring geometry regression QA
        run: npm run qa:geometry

      - name: Build
        run: npm run build

      - name: TPE Metro layout QA
        run: npm run qa:layouts


      - name: Render TPE Metro QA SVGs
        if: always()
        run: npm run qa:render

      - name: Upload TPE Metro QA SVGs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tpe-metro-style-qa
          path: |
            qa-artifacts/*.svg
            qa-artifacts/moscow-geography.json
          if-no-files-found: error
