name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify canonical TPE_Metro.xlsm
        run: |
          test -s TPE_Metro.xlsm
          unzip -l TPE_Metro.xlsm | grep -q 'xl/vbaProject.bin'
          echo "TPE_Metro.xlsm exists and contains embedded VBA."

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json

      - name: Install
        run: npm install --no-audit --no-fund

      - name: TypeScript and production build
        run: npm run build

      - name: Station and ring geometry regressions
        run: npm run qa:geometry

      - name: Workbook layouts, geometry and SVGs
        run: npm run qa:workbook

      - name: Install Chromium and Traditional Chinese fonts
        if: always()
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          npx playwright install --with-deps chromium

      - name: Check all print layouts and create PDFs
        if: always()
        env:
          METRO_PRINT_PDF: '1'
          METRO_SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: npm run qa:print

      - name: Verify workbook import, station focus and SVG download in Chromium
        run: npm run qa:browser

      - name: Upload workbook SVGs, print PDFs and audit data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tpe-metro-style-qa
          path: |
            qa-artifacts/*.svg
            qa-artifacts/*.json
            qa-artifacts/print/*.pdf
          if-no-files-found: error
