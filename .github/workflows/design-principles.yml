name: Design Principles QA

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: design-principles-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Audit topology, angles, corners, parallel lanes and spacing
        run: npm run qa:principles
